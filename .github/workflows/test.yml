# Build, lint and unit-test on every push/PR. Acceptance tests are NOT run
# here — they need live VCP_* credentials (see Makefile `testacc`).
name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build, lint & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - run: go mod download

      - run: go build -v ./...

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      # Single source of truth for the version: the Makefile pin.
      - name: Resolve golangci-lint version
        id: golangci
        run: echo "version=$(make -s print-GOLANGCI_VERSION)" >> "$GITHUB_OUTPUT"

      - name: Run linters
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ steps.golangci.outputs.version }}

      # examples/ is rendered into docs/ by tfplugindocs, so it must be formatted.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.15.*'
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive examples/

      - name: Unit tests
        run: go test -v ./...

  docs:
    name: Docs are up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      # tfplugindocs needs the Terraform CLI to extract the provider schema.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.15.*'
          terraform_wrapper: false

      # Uses the tfplugindocs version pinned in the Makefile, same as locally.
      - run: make docs-generate

      # `git add -N` first: plain `git diff` ignores untracked files, so without
      # it a brand-new resource's generated page would not fail this job.
      - name: git diff
        run: |
          git add -N docs/
          git diff --compact-summary --exit-code -- docs/ || \
            (echo; echo "docs/ is out of date. Run 'make docs-generate' and commit."; exit 1)
